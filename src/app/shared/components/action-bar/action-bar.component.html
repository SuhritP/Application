<ActionBar [title]="title">
    <NavigationButton *ngIf="canGoBack" android.systemIcon="ic_menu_back" (tap)="onGoBack()" android.position="actionBar"> </NavigationButton>
    <ActionItem *ngIf="canGoBack && showHomeIcon" android.position="actionBar" class="fas" icon="font://&#xf015;" nsRouterLink="/home" pageTransition="slideLeft"></ActionItem>
    <ActionItem *ngIf="hasMenu" android.position="actionBar" (tap)="onSideDrawer()" class="fas" icon="font://&#xf0c9;"></ActionItem>
</ActionBar>
